server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Socket.IO's own path, separate from /api/. Needs the Upgrade/Connection
    # headers below or nginx will only ever pass through plain HTTP requests
    # (which is what "polling" transport actually is) and never let the
    # connection switch to a real WebSocket — the client keeps re-polling
    # every ~2s forever instead of upgrading, which is the exact symptom
    # you'd see in DevTools if this block were missing.
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
