name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --ci
        env:
          JWT_SECRET: ci-test-secret-not-for-production

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pqa:ci .
      - name: Run container
        run: |
          docker run -d --name pqa -p 4000:4000 \
            -e JWT_SECRET=ci-secret -e API_KEYS=demo:sk_ci \
            -e ALLOWED_ORIGINS=http://localhost:4000 pqa:ci
          curl -sf --retry 12 --retry-delay 5 --retry-connrefused http://localhost:4000/api/health
      - name: Smoke test
        run: ./infra/azure/smoke-test.sh http://localhost:4000 sk_ci
      - name: Robot Framework API tests
        run: |
          pip install robotframework robotframework-requests
          robot --outputdir robot-results \
            --variable BASE_URL:http://localhost:4000 \
            --variable API_KEY:sk_ci \
            backend/tests/robot/api_tests.robot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: robot-results/