services:
  backend:
    build:
      context: ./backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped
